# iOS 云构建（03 手册 §4.1 + 旧工程 dvhdjdjdnddmaker/test 实证配置合并）：
# push main 自动跑；Actions 页可手动触发。产物 = 未签名 diary.ipa
# → 下载后本机 Sideloadly 用 Apple ID 自签安装（03 §5）。
name: build-ios
on:
  push:
    branches: [main]
    paths: ["lib/**", "ios/**", "pubspec.yaml", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable

      # 旧工程实证步骤：先列出镜像可用 Xcode 便于排查，再优先选 26.6.0；
      # GitHub 镜像轮换若已移除该版本，回落默认 Xcode 不阻塞
      - name: List available Xcode versions
        run: ls /Applications/ | grep Xcode
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.6.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.0.app
          else
            echo "Xcode_26.6.0 不在本批次镜像中，使用默认 Xcode："
            xcodebuild -version
          fi

      - run: flutter pub get
      - run: flutter test
      - run: flutter build ios --release --no-codesign

      - name: 打包未签名 ipa
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry diary.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: diary-ipa-${{ github.sha }}
          path: build/ios/iphoneos/diary.ipa
